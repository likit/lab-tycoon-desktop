decision_name: possible_duplicate_order
description: Detect whether an order should receive a passive duplicate-review recommendation.

conditions:
  match_all:
    - match_any:
        - field: payload.duplicate_candidate
          equals: true
        - field: payload.repeated_indicator
          equals: true
        - field: payload.possible_duplicate
          equals: true
    - field: payload.priority
      not_equals: urgent

outcomes:
  matched:
    reason: Order payload contains a duplicate-order indicator.
  unmatched:
    reason: No duplicate-order indicators were present.