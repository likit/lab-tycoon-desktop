name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Create isolated build environment
        run: |
          $buildVenv = Join-Path $env:RUNNER_TEMP 'labtycoon-build-venv'
          python -m venv $buildVenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $buildVenv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pywin32-ctypes
          python -m pip check

      - name: Check GUI and credential backend imports
        run: |
          python -c "import tkinter; import keyring.backends.Windows; import win32ctypes.pywin32.win32cred; print('Windows GUI and credential imports OK')"

      - name: Package LabTycoon
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name LabTycoon --add-data "app/assets:app/assets" --add-data "app/logo.png:app" --add-data "app/system/orchestration/workflows:app/system/orchestration/workflows" --collect-all SpiffWorkflow --collect-all keyring --collect-submodules win32ctypes --hidden-import keyring.backends.Windows --hidden-import sqlalchemy.dialects.sqlite run.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE dist/LabTycoon/LICENSE.txt
          Copy-Item README.md dist/LabTycoon/README.md

      - name: Smoke-test packaged entry point
        run: |
          python -c "import subprocess; subprocess.run(['dist/LabTycoon/LabTycoon.exe', '--help'], check=True, timeout=60)"

      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: LabTycoon-Windows-x64
          path: dist/LabTycoon/
          if-no-files-found: error
          retention-days: 14
